name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish hubb-ha-ui.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Version matches the tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/hubb-ha-ui.js --title "$GITHUB_REF_NAME" --notes-from-tag

  # A Release made with GITHUB_TOKEN triggers no other workflow, so hacs.yml never sees it:
  # the validation runs here, once the Release and its asset exist.
  hacs:
    name: HACS validation
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: plugin
